name: BiH Energy Daily Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bih-daily-update
  cancel-in-progress: false

jobs:
  update-bih-master-csv:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run BiH updater
        run: |
          python3 update_bih.py
          python3 regional_prices.py
          python3 current_gdp.py
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}

      # Good data is saved first, even if a later check fails.
      - name: Commit and push updated files
        run: |
          git config user.name "BiH Energy Auto-Updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in bih_data.csv Generation_Monthly.csv change_log.csv status.json nos_hourly.csv flows_snapshots.csv regional_day_ahead_prices.csv regional_day_ahead_prices_hr_me.csv balancing_prices.csv current_gdp.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore(data): auto-update $(date -u +'%Y-%m-%d %H:%M')"
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying"; sleep $((attempt * 4))
            done
            [ "$pushed" = 1 ]
          fi

      # Turns NOS failures and dataset failures into a red run.
      - name: Fail the run if NOS or any dataset failed
        run: |
          python3 - <<'PY'
          import json, sys
          from pipeline_status import problems
          with open("status.json", encoding="utf-8") as f:
              status = json.load(f)
          for name, item in status.get("dataset_details", {}).items():
              if item["state"] == "STATIC_REFERENCE":
                  print(f"::warning::{name}: historical typed-in reference, not freshly verified")
          issues = problems(status)
          for issue in issues:
              print(f"::error::{issue}")
          sys.exit(1 if issues else 0)
          PY

      - name: Send failure alert email
        # Re-enable only after reviewing stricter failure states and recipients.
        if: failure() && vars.ENABLE_FAILURE_EMAIL == 'true' && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[ALERT] BiH Energy auto-update failed"
          to: "george.michael@elsewedy.com"
          from: "BiH Energy Auto-Updater <george.michael@elsewedy.com>"
          body: |
            The BiH Energy update failed.
            Repository: ${{ github.repository }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

name: BiH Energy Daily Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bih-daily-update
  cancel-in-progress: false

jobs:
  update-bih-master-csv:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BiH updater
        run: python3 update_bih.py

      # Good data is saved first, even if a later check fails.
      - name: Commit and push updated files
        run: |
          git config user.name "BiH Energy Auto-Updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in bih_data.csv Generation_Monthly.csv change_log.csv status.json nos_hourly.csv flows_snapshots.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore(data): auto-update $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # Turns NOS failures and dataset failures into a red run.
      - name: Fail the run if NOS or any dataset failed
        run: |
          python3 - <<'PY'
          import json, sys
          with open("status.json", encoding="utf-8") as f:
              s = json.load(f)
          problems = []
          if s.get("nos_error"):
              problems.append(f"NOS: {s['nos_error']}")
          if s.get("nos_days_failed"):
              problems.append(f"NOS days failed: {s['nos_days_failed']}")
          for k, v in s.get("datasets", {}).items():
              if str(v).startswith("FAILED"):
                  problems.append(f"{k}: {v}")
          if s.get("nos_date_source") == "assumed_today":
              print("::warning::NOS date taken from the current day; the page has no date input.")
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("All checks OK.")
          PY

      - name: Send failure alert email
        if: failure() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[ALERT] BiH Energy auto-update failed"
          to: "george.michael@elsewedy.com"
          from: "BiH Energy Auto-Updater <george.michael@elsewedy.com>"
          body: |
            The BiH Energy update failed.
            Repository: ${{ github.repository }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

name: BiH ENTSO-E Daily Update

on:
  schedule:
    - cron: '30 2 * * *'     # 02:30 UTC, after the previous Europe/Sarajevo day is complete
  workflow_dispatch:
    inputs:
      workers:
        description: 'Datasets fetched in parallel (1 = sequential)'
        default: '3'

permissions:
  contents: write

# Same group as daily_update.yml, so the two workflows never push at the same time.
concurrency:
  group: bih-daily-update
  cancel-in-progress: false

jobs:
  entsoe-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      # Fails the run if the token is missing, any direction fails, or nothing was recorded.
      - name: Fetch previous-day ENTSO-E data
        env:
          ENTSOE_WORKERS: ${{ github.event.inputs.workers || '3' }}
        run: |
          python3 - <<'PY'
          import sys
          from entsoe_adapter import update_entsoe
          from pipeline_status import DATASETS
          update_entsoe(include_physical=False, include_capacity=True)
          names = [k for k in DATASETS if k.startswith("entsoe_")]
          if not names:
              print("::error::No ENTSO-E dataset state was recorded")
              sys.exit(1)
          bad = {k: DATASETS[k] for k in names if DATASETS[k]["state"] != "OK"}
          for k, v in bad.items():
              print(f"::error::{k}: {v['state']} {v['detail']}")
          sys.exit(1 if bad else 0)
          PY

      - name: Fetch actual load and generation per type
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import sys
          from entsoe_actuals import update_actuals
          from pipeline_status import DATASETS
          update_actuals()
          names = ["entsoe_actual_load", "entsoe_actual_generation"]
          bad = {k: DATASETS.get(k, {"state": "MISSING", "detail": ""}) for k in names if DATASETS.get(k, {}).get("state") != "OK"}
          for k, v in bad.items():
              print(f"::error::{k}: {v['state']} {v['detail']}")
          sys.exit(1 if bad else 0)
          PY

      # Only load and HR schedule CSVs (physical flows have their own rolling writer) are committed here. status.json is owned by the 30-minute job.
      # Also runs after a partial failure so valid recovered days are saved; the run still ends red.
      - name: Commit and push ENTSO-E CSVs
        if: success() || failure()
        run: |
          git config user.name "BiH Energy Auto-Updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in entsoe_load_forecast.csv entsoe_hr_schedules.csv entsoe_scheduled_rs_me.csv entsoe_scheduled_total.csv entsoe_ntc_day_ahead.csv entsoe_nominated_daily.csv entsoe_actual_load.csv entsoe_actual_generation.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No ENTSO-E changes this run."
          else
            git commit -m "chore(entsoe): daily previous-day update $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

